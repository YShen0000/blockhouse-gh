name: Python Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend/FastAPI

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Run tests
      env:
        API_KEY: ${{ secrets.API_KEY }}
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        MONGODB_URL: ${{ secrets.MONGODB_URL }}
        MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_STORAGE_BUCKET: ${{ secrets.AWS_STORAGE_BUCKET }}
        DOCS_USERNAME: ${{ secrets.DOCS_USERNAME }}
        DOCS_PASSWORD: ${{ secrets.DOCS_PASSWORD }}
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_LOGGING_ENV: ${{ secrets.DD_LOGGING_ENV }}
        DD_SERVICE: ${{ secrets.DD_SERVICE }}
        DD_HOSTNAME: ${{ secrets.DD_HOSTNAME }}
      run: |
        pytest --cov=app --cov-report=xml
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./Backend/FastAPI/coverage.xml
        fail_ci_if_error: true 